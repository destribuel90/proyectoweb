<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAGE - Editar producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="http://127.0.0.1:8000/css/style.css">
    <link rel="stylesheet" href="http://127.0.0.1:8000/css/productos.css">
</head>
<body>
    <div class="container">
        <header>
            <a href="http://127.0.0.1:8000/"><h1 class="header__centered">TAGE</h1></a>
            <div class="search-bar">
                <input type="text" placeholder="Buscar productos..." id="search-bar-text">
                <button id="search-bar-button">Buscar</button>
            </div>
            <div class="header-buttons">
                <div class="user">
                    <img src="http://127.0.0.1:8000/icons/user-icon.svg" alt="Icono de usuario" id="imgUser">
                    <span><a href="http://127.0.0.1:8000/sesion" id="Iniciar">Iniciar sesión</a></span>
                </div>
                <div class="cart">
                    <span id="saldo">$0.00</span>
                </div>
            </div>
        </header>

        <div class="main">
            <nav>
                <ul class="menu-horizontal">
                    <li>
                        <a href="#">Categorías</a>
                        <ul class="menu-vertical">
                            <li><a href="http://127.0.0.1:8000/electronica">Electronica</a></li>
                            <li><a href="http://127.0.0.1:8000/muebles">Muebles</a></li>
                            <li><a href="http://127.0.0.1:8000/autos">Autos</a></li>
                        </ul>
                    </li>
                    <li>
                        <a href="#">Contactos</a>
                        <ul class="menu-vertical">
                        </ul>
                    </li>
                    <li><a href="http://127.0.0.1:8000/vender">Vender</a></li>
                </ul>
            </nav>

            <div class="category">
                <h2>Editar producto</h2>
            </div>

            <div class="row justify-content-center my-4">
                <div class="col-12 col-md-8 col-lg-6">
                    <form id="form-producto" class="card card-body shadow-sm" novalidate>
                        <div class="text-center mb-3">
                            <img id="preview" src="" alt="Imagen del producto"
                                 class="border rounded" width="200" style="max-width: 100%; object-fit: cover;">
                        </div>

                        <div class="mb-3">
                            <label for="image" class="form-label">Imagen</label>
                            <input type="file" class="form-control" id="image" name="image" accept="image/*">
                            <div class="form-text">Déjala vacía para conservar la imagen actual.</div>
                        </div>

                        <div class="mb-3">
                            <label for="name" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="name" name="name" maxlength="255" required>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Descripción</label>
                            <textarea class="form-control" id="description" name="description" rows="4" maxlength="700" required></textarea>
                        </div>

                        <div class="row">
                            <div class="col-6 mb-3">
                                <label for="price" class="form-label">Precio</label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" class="form-control" id="price" name="price" step="0.01" min="0" required>
                                </div>
                            </div>
                            <div class="col-6 mb-3">
                                <label for="stock" class="form-label">Stock</label>
                                <input type="number" class="form-control" id="stock" name="stock" min="0" required>
                            </div>
                        </div>

                        <p id="mensaje" class="fw-semibold"></p>

                        <div class="d-flex gap-2 justify-content-end">
                            <a href="http://127.0.0.1:8000/" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Guardar cambios</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <footer>
            <p>&copy; 2026 TAGE. Todos los derechos reservados.</p>
        </footer>
    </div>

    <script type="module" src="http://127.0.0.1:8000/js/constantes.js"></script>
    <script type="module" src="http://127.0.0.1:8000/js/dataUser.js"></script>
    <script type="module" src="http://127.0.0.1:8000/js/buscador.js"></script>
    <script type="module" src="http://127.0.0.1:8000/js/editProduct.js"></script>
</body>
</html>
